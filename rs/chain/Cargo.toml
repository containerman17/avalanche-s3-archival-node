[package]
name = "epochdb-chain"
version = "0.1.0"
edition = "2021"

[lib]
name = "chain"
path = "src/lib.rs"

[[bin]]
name = "vbench"
path = "src/bin/vbench.rs"

[dependencies]
base64 = "0.22"
secp256k1 = { version = "0.31", features = ["recovery"] }
block = { package = "epochdb-block", path = "../block" }
exec = { package = "epochdb-exec", path = "../exec" }
node = { package = "epochdb-node", path = "../node" }
rpc = { package = "epochdb-rpc", path = "../rpc" }
state = { package = "epochdb-state", path = "../state" }
store = { package = "epochdb-store", path = "../store" }
alloy-consensus = { version = "2", features = ["std"] }
alloy-primitives = { version = "1.6", features = ["asm-keccak", "map", "rlp", "serde"] }
alloy-rlp = "0.3"
alloy-eips = { version = "2", features = ["std"] }
alloy-trie = "0.9"
anyhow = "1"
hex = "0.4"
rayon = "1"
revm = { version = "43", features = ["std", "serde"] }
bytes = "1"
serde_json = "1"
sha2 = "0.10"
