[package]
name = "epochdb-rpc"
version = "0.1.0"
edition = "2021"

[lib]
name = "rpc"
path = "src/lib.rs"

[[bin]]
name = "epochdb-rpc-serve"
path = "src/bin/serve.rs"

[dependencies]
block = { package = "epochdb-block", path = "../block" }
exec = { package = "epochdb-exec", path = "../exec" }
store = { package = "epochdb-store", path = "../store" }
alloy-primitives = { version = "1", features = ["asm-keccak", "map", "rlp", "serde"] }
alloy-rlp = "0.3"
alloy-trie = "0.9"
alloy-consensus = { version = "2", features = ["std"] }
alloy-eips = { version = "2", features = ["std"] }
alloy-rpc-types-trace = "2"
revm = { version = "43", features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
