[package]
name = "cnode"
version = "0.1.0"
edition = "2021"
description = "In-process mainnet C-chain state follower for a trading bot: flat state in memory, revm simulation, root checker, block and mempool history"

[dependencies]
alloy-primitives = { version = "1", features = ["std", "map", "serde", "rlp", "asm-keccak"] }
revm = { version = "43", features = ["std", "serde"] }
papaya = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "2", features = ["json"] }
tungstenite = "0.28"
url = "2"
