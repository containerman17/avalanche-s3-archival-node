language = "C"
usize_is_size_t = true
include_guard = "EPOCHDB_ENGINE_H"
include_version = false
header = "/* epochdb engine C ABI. Generated by cbindgen from rs/ffi/src/lib.rs; ABI.md is the contract. */"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
cpp_compat = true
documentation = true
style = "both"

[export]
include = ["epochdb_buf", "epochdb_block_meta", "epochdb_verify_out", "epochdb_build_out", "epochdb_engine"]

[fn]
sort_by = "None"

[enum]
prefix_with_name = false
