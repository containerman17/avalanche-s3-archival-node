[package]
name = "epochdb-plugin"
version = "0.1.0"
edition = "2021"

[lib]
name = "plugin"
path = "src/lib.rs"

[[bin]]
name = "epochdb-rs"
path = "src/main.rs"

[dependencies]
block = { package = "epochdb-block", path = "../block" }
alloy-primitives = { version = "1.6", features = ["asm-keccak"] }
bytes = "1"
prost = "0.14"
prost-types = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
sha2 = "0.10"
