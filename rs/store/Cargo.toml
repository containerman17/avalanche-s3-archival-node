[package]
name = "epochdb-store"
version = "0.1.0"
edition = "2021"

[lib]
name = "store"
path = "src/lib.rs"

[dependencies]
state = { package = "epochdb-state", path = "../state" }
block = { package = "epochdb-block", path = "../block" }
exec = { package = "epochdb-exec", path = "../exec" }
memmap2 = "0.9"
zstd = "0.13"
sha2 = "0.10"
hmac = "0.12"
crc32c = "0.6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "2", default-features = false }
alloy-primitives = { version = "1", features = ["rlp"] }
alloy-consensus = { version = "2", features = ["std"] }
alloy-rlp = "0.3"

[profile.release]
debug = 1
