syntax = "proto3";

// THE PRIMARY REMOTE API (user ruling 2026-08-12: "gRPC should be the best way
// to access it"). It is a PEER adapter over the core query layer (rpc.Server's
// direct methods), never a proxy to JSON-RPC.
//
// BYTES ARE VERBATIM CONSENSUS RLP wherever the corpus stores RLP: a header, a
// transaction. Nothing is re-serialized into a field-by-field shape that could
// disagree with the stored bytes, and a caller that wants fields decodes with
// the EVM library it already links. Numbers that are not RLP (heights, TxNums,
// gas) are plain integers, and big integers travel as big-endian bytes.
package epochdb.v0;

option go_package = "github.com/containerman17/epochdb/grpcapi";

service EpochDB {
  // GetHead is the serving frontier: latest, pending and safe at once.
  rpc GetHead(HeadRequest) returns (HeadResponse);
  // StreamHeads pushes one HeadResponse per new block until the caller goes
  // away.
  rpc StreamHeads(HeadRequest) returns (stream HeadResponse);
  rpc GetBlock(BlockRequest) returns (BlockResponse);
  rpc GetTransaction(TransactionRequest) returns (TransactionResponse);
  rpc Call(CallRequest) returns (CallResponse);
  rpc GetState(StateRequest) returns (StateResponse);
  rpc SearchTransactionsByAddress(SearchRequest) returns (SearchResponse);
  rpc GetLogs(LogsRequest) returns (LogsResponse);
}

message HeadRequest {}

message HeadResponse {
  uint64 number = 1;    // last block served: `latest`
  bytes hash = 2;
  uint64 timestamp = 3;
  uint64 accepted = 4;  // the follower's accepted head: `pending`
  uint64 settled = 5;   // SAE-settled: `safe`/`finalized`
}

// BlockRequest names a block by hash if hash is set, by number otherwise.
// full=false answers with the header and the transaction COUNT only.
message BlockRequest {
  uint64 number = 1;
  bytes hash = 2;
  bool full = 3;
}

message BlockResponse {
  uint64 number = 1;
  bytes hash = 2;
  bytes header_rlp = 3;       // the stored consensus bytes, verbatim
  uint32 tx_count = 4;
  repeated bytes tx_rlp = 5;  // full=true only, in block order
}

message TransactionRequest {
  bytes hash = 1;
}

// found=false is a clean "unknown transaction", never an error.
message TransactionResponse {
  bool found = 1;
  bytes tx_rlp = 2;
  uint64 block_number = 3;
  bytes block_hash = 4;
  uint32 index = 5;
  Receipt receipt = 6;
  repeated Frame frames = 7;  // the STORED call frames, never a re-execution
}

message Receipt {
  uint64 status = 1;
  uint64 gas_used = 2;
  uint64 cumulative_gas_used = 3;
  bytes contract_address = 4;  // empty unless the tx created one
  repeated Log logs = 5;
}

message Log {
  bytes address = 1;
  repeated bytes topics = 2;
  bytes data = 3;
  uint64 block_number = 4;
  bytes tx_hash = 5;
  uint32 tx_index = 6;
  uint32 index = 7;
}

// Frame is one stored call frame in enter order. kind is the vm.OpCode of the
// call that opened it.
message Frame {
  uint32 kind = 1;
  uint32 depth = 2;
  bytes from = 3;
  bytes to = 4;
  bytes value = 5;  // big-endian, empty for none
  uint64 gas = 6;
  uint64 gas_used = 7;
  bool failed = 8;
  bytes input = 9;
  bytes output = 10;
}

// CallRequest is an eth_call at a height. height 0 means the serving head.
message CallRequest {
  bytes from = 1;
  bytes to = 2;       // empty is a contract creation
  bytes value = 3;    // big-endian
  uint64 gas = 4;     // 0 takes the server's cap
  bytes gas_price = 5;
  bytes data = 6;
  uint64 height = 7;
}

message CallResponse {
  bytes output = 1;
}

// StateRequest reads one account at a height, and one storage slot of it when
// slot is set. height 0 means the serving head.
message StateRequest {
  bytes address = 1;
  bytes slot = 2;
  uint64 height = 3;
  bool with_code = 4;
}

message StateResponse {
  uint64 nonce = 1;
  bytes balance = 2;  // big-endian
  bytes code_hash = 3;
  bytes code = 4;      // with_code only
  bytes slot_value = 5;
}

// SearchRequest is KEYSET paging over the address's posting rows: cursor is
// the TxNum to continue from (inclusive), 0 meaning the end the walk starts
// at. Newest-first unless ascending.
message SearchRequest {
  bytes address = 1;
  uint64 cursor = 2;
  uint32 limit = 3;
  bool ascending = 4;
}

message SearchResponse {
  repeated AddrHit hits = 1;
  bool more = 2;  // exact, not guessed: the walk reads one row past the page
}

message AddrHit {
  uint64 tx_num = 1;
  uint64 height = 2;
  bytes hash = 3;
  uint32 roles = 4;  // store.Role* bits: sender, recipient, created, emitter, frame
}

message LogsRequest {
  uint64 from_block = 1;
  uint64 to_block = 2;
  repeated bytes addresses = 3;
  repeated TopicSet topics = 4;  // position i matches topic i; empty set matches any
}

message TopicSet {
  repeated bytes values = 1;
}

message LogsResponse {
  repeated Log logs = 1;
}
